name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o Jio_AirFiber_Android_Project.zip -d project
          find project -maxdepth 2 -type f | head -30

      - name: Build APK
        working-directory: project/Jio_AirFiber_Android_Project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jio-AirFiber-Tracker-APK
          path: project/Jio_AirFiber_Android_Project/app/build/outputs/apk/debug/app-debug.apk
