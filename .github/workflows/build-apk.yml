name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -o Jio_AirFiber_Android_Project.zip -d project

      - name: Find and build Android project
        run: |
          BUILD_DIR=$(dirname "$(find project -type f -name settings.gradle | head -1)")
          echo "Android project found at: $BUILD_DIR"
          cd "$BUILD_DIR"

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          cat > fix-dependencies.gradle <<'EOF'
          allprojects {
              configurations.all {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"

                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          if (details.requested.name == "kotlin-stdlib") {
                              details.useVersion "1.8.22"
                          }
                      }
                  }
              }
          }
          EOF

          gradle --init-script fix-dependencies.gradle assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output

          APK=$(find project -type f -path "*/app/build/outputs/apk/debug/app-debug.apk" | head -1)

          echo "APK found at: $APK"

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          cp "$APK" output/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jio-AirFiber-Tracker-APK
          path: output/app-debug.apk
